services:
  postgres:
    image: postgres:18
    container_name: fit_the_meet_db
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - ./_postgres:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:8.8
    container_name: fit_the_meet_redis
    ports:
      - "6379:6379"
    env_file:
      - .env
    command:
      - /bin/sh
      - -c
      - 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
